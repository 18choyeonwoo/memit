services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: memit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 외부 미노출 — backend만 접근

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env.production
    environment:
      # IAM 키 경로 (컨테이너 내부)
      GOOGLE_APPLICATION_CREDENTIALS: /app/iam-key.json
    volumes:
      - ./backend/iam-key.json:/app/iam-key.json:ro
      - ./backend/static:/app/static   # GCS 미사용 시 로컬 이미지 보존용
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
